<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Pro Shooter</title>
    <link rel="stylesheet" href="css/styles.css?rev=larger-buttons-20261101-10">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>

<body class="focused-page">

    <!-- Focused form with a back arrow only. -->
    <main class="focused-main">

        <section class="account-panel" aria-labelledby="pageTitle">

            <header class="panel-heading">

                <a class="back-link" href="index.html" aria-label="Back to title screen">

                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 12H5 M12 5L5 12L12 19"></path>
                    </svg>

                </a>

                <h1 id="pageTitle">Register</h1>

            </header>


            <!-- Input is validated in JavaScript, not by native browser rules. -->
            <form id="registerForm" novalidate>

                <label for="registerUsername">Player Name</label>

                <input
                    type="text"
                    id="registerUsername"
                    name="username"
                    autocomplete="username"
                    aria-required="true"
                >

                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    autocomplete="new-password"
                    aria-required="true"
                >

                <label for="registerEmail">Email</label>

                <input
                    type="text"
                    id="registerEmail"
                    name="email"
                    inputmode="email"
                    autocomplete="email"
                    aria-required="true"
                >

                <label for="registerPhone">Phone Number</label>

                <input
                    type="text"
                    id="registerPhone"
                    name="phone"
                    inputmode="tel"
                    autocomplete="tel"
                    aria-required="true"
                >

                <button class="primary-button account-submit" type="submit">
                    Register
                </button>

            </form>

            <!-- A message appears only when there is a validation or storage error. -->
            <p id="registerMessage" class="account-message" role="status"></p>

        </section>

    </main>


    <!-- Shared account module -->

    <script type="module" src="js/app.js?rev=larger-buttons-20261101-10"></script>

</body>
</html>
